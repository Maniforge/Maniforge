openapi: 3.0.3
info:
  title: Maniforge RBAC API
  version: 0.2.0
  description: |
    OpenAPI contract for implemented Maniforge RBAC endpoints.

    Credential model: see docs/MANIFORGE_CREDENTIAL_ARCHITECTURE.md.
    After login send only Bearer access_token (+ CSRF / X-Action-Token for sensitive writes).
    MFA note: `POST /api/v1/auth/reauth` issues action_token and sets mfa_verified_at.
servers:
  - url: /rbac
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    csrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    actionTokenHeader:
      name: X-Action-Token
      in: header
      required: false
      schema:
        type: string
      description: Short-lived token from POST /api/v1/auth/reauth for admin mutations when step-up is required.
  schemas:
    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: string
        item_index:
          type: integer
          description: Present for batch validation/guard errors.
        method:
          type: string
        path:
          type: string
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
    User:
      type: object
      properties:
        id: { type: integer }
        login: { type: string }
        email: { type: string, format: email }
        status:
          type: string
          enum: [active, locked, disabled]
        mfa_required: { type: boolean }
        security_version: { type: integer }
        created_at: { type: string }
        updated_at: { type: string, nullable: true }
    SessionToken:
      type: object
      required: [credential_type, session_id, access_token, refresh_token, expires_in, scope]
      properties:
        credential_type:
          type: string
          enum: [session_access]
        session_id: { type: string }
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in:
          type: integer
          description: Access token TTL in seconds.
        scope:
          type: object
          required: [tenant_id, subtenant_id]
          properties:
            tenant_id: { type: string }
            subtenant_id: { type: string }
    ActionToken:
      type: object
      required: [credential_type, action_token, expires_in, purpose]
      properties:
        credential_type:
          type: string
          enum: [action]
        action_token: { type: string }
        expires_in: { type: integer }
        purpose:
          type: string
          enum: [admin_sensitive]
    SessionInfo:
      type: object
      properties:
        id: { type: string }
        user_id: { type: integer }
        tenant_id: { type: string }
        subtenant_id: { type: string }
        aal: { type: string, enum: [AAL1, AAL2] }
        expires_at: { type: string }
    LoginResponse:
      type: object
      required: [ok, user, session, csrf_token]
      properties:
        ok:
          type: boolean
          enum: [true]
        user:
          type: object
          properties:
            id: { type: integer }
            login: { type: string }
            email: { type: string, format: email }
            security_version: { type: integer }
        session:
          $ref: '#/components/schemas/SessionToken'
        csrf_token:
          type: string
          description: Use as X-CSRF-Token for state-changing requests.
    RefreshResponse:
      type: object
      required: [ok, session]
      properties:
        ok:
          type: boolean
          enum: [true]
        session:
          $ref: '#/components/schemas/SessionToken'
    AccessSnapshot:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    Role:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        is_system: { type: boolean }
        created_at: { type: string }
    Permission:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        description: { type: string, nullable: true }
    UserRoleAssignment:
      type: object
      properties:
        id: { type: integer }
        role_code: { type: string }
        role_name: { type: string }
        assigned_by: { type: integer, nullable: true }
        assigned_at: { type: string }
        expires_at: { type: string, nullable: true }
    PolicyRules:
      type: object
      properties:
        source:
          type: string
          enum: [db, env]
        allowed_ips:
          type: array
          items:
            type: string
        allowed_hour_start_utc:
          type: integer
          minimum: 0
          maximum: 23
        allowed_hour_end_utc:
          type: integer
          minimum: 0
          maximum: 23
        require_step_up:
          type: boolean
    RoleMutation:
      type: object
      required: [user_id, role_code, action]
      properties:
        user_id: { type: integer }
        role_code: { type: string }
        action:
          type: string
          enum: [assign, revoke]
    RoleBatchSummary:
      type: object
      required: [assigned, revoked, skipped, total]
      properties:
        assigned: { type: integer }
        revoked: { type: integer }
        skipped: { type: integer }
        total: { type: integer }
    UserStatusMutation:
      type: object
      required: [user_id, status]
      properties:
        user_id: { type: integer }
        status:
          type: string
          enum: [active, locked, disabled]
    UserStatusBatchSummary:
      type: object
      required: [changed, skipped, not_found, total, by_status]
      properties:
        changed: { type: integer }
        skipped: { type: integer }
        not_found: { type: integer }
        total: { type: integer }
        by_status:
          type: object
          properties:
            active: { type: integer }
            locked: { type: integer }
            disabled: { type: integer }
    SessionBatchRevokeSummary:
      type: object
      required: [revoked, skipped, total]
      properties:
        revoked: { type: integer }
        skipped: { type: integer }
        total: { type: integer }
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Role, permission, policy, step-up, or guard check failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request payload or query parameters are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested entity or route was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, status, tenancy_mode, timestamp]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  service: { type: string }
                  status: { type: string }
                  tenancy_mode: { type: string }
                  timestamp: { type: string, format: date-time }
  /api/v1/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Login temporarily locked after too many failures.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      locked_until:
                        type: string
  /api/v1/auth/refresh:
    post:
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Token rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/auth/reauth:
    post:
      summary: Step-up reauth
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200':
          description: Step-up success
          content:
            application/json:
              schema:
                type: object
                required: [ok, step_up, credentials]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  step_up:
                    type: boolean
                    enum: [true]
                  credentials:
                    type: object
                    required: [action]
                    properties:
                      action:
                        $ref: '#/components/schemas/ActionToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/logout:
    post:
      summary: Logout current session
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/logout-all:
    post:
      summary: Logout all sessions for user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200':
          description: All sessions revoked
          content:
            application/json:
              schema:
                type: object
                required: [ok, revoked_sessions]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  revoked_sessions: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/contexts:
    get:
      summary: List home and delegated session contexts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Available contexts for switch-context
          content:
            application/json:
              schema:
                type: object
                required: [ok, home, delegated, current]
                properties:
                  ok: { type: boolean, enum: [true] }
                  current:
                    type: object
                    properties:
                      tenant_id: { type: string }
                      subtenant_id: { type: string }
                      kind: { type: string, enum: [home, delegated] }
                      grant_level: { type: string, nullable: true }
                  home:
                    type: array
                    items: { type: object }
                  delegated:
                    type: array
                    items: { type: object }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/switch-context:
    post:
      summary: Switch session tenant/subtenant context
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, subtenant_id]
              properties:
                tenant_id: { type: string }
                subtenant_id: { type: string }
      responses:
        '200':
          description: Context switched
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/me:
    get:
      summary: Current session details
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session info
          content:
            application/json:
              schema:
                type: object
                required: [ok, session]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  session:
                    $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/permissions:
    get:
      summary: Get effective permissions for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Permission codes
          content:
            application/json:
              schema:
                type: object
                required: [ok, items]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  items:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/access:
    get:
      summary: Get effective roles and permissions for current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Access snapshot
          content:
            application/json:
              schema:
                type: object
                required: [ok, access]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  access:
                    $ref: '#/components/schemas/AccessSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/console-access:
    get:
      summary: Unified admin console module access flags
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Console modules tenant/platform
          content:
            application/json:
              schema:
                type: object
                required: [ok, roles, modules]
                properties:
                  ok: { type: boolean, enum: [true] }
                  roles:
                    type: array
                    items: { type: string }
                  modules:
                    type: object
                    required: [tenant, platform]
                    properties:
                      tenant: { type: boolean }
                      platform: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/security/password:
    post:
      summary: Change password (requires step-up)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        '200':
          description: Password changed and sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  revoked_sessions: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/users:
    get:
      summary: List users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Users list
          content:
            application/json:
              schema:
                type: object
                required: [ok, items]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create user in current tenant scope
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, email, password, reason]
              properties:
                login: { type: string }
                email: { type: string, format: email }
                password: { type: string }
                status: { type: string, enum: [active, locked, disabled] }
                mfa_required: { type: boolean }
                reason: { type: string }
      responses:
        '201':
          description: User created. Active users are checked against tenant license seats.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      summary: Update user in current tenant scope
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, reason]
              properties:
                user_id: { type: integer }
                login: { type: string }
                email: { type: string, format: email }
                password: { type: string }
                status: { type: string, enum: [active, locked, disabled] }
                mfa_required: { type: boolean }
                reason: { type: string }
      responses:
        '200':
          description: User updated. Activating users is checked against tenant license seats.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete user in current tenant scope
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, reason]
              properties:
                user_id: { type: integer }
                reason: { type: string }
      responses:
        '200':
          description: User deleted and sessions revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/users/batch-status:
    post:
      summary: Batch change user status in one transaction
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, items]
              properties:
                reason: { type: string }
                dry_run: { type: boolean }
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/UserStatusMutation'
      responses:
        '200':
          description: Batch user status update completed
          content:
            application/json:
              schema:
                type: object
                required: [ok, summary]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  dry_run:
                    type: boolean
                  summary:
                    $ref: '#/components/schemas/UserStatusBatchSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/sessions:
    get:
      summary: List sessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessions list
          content:
            application/json:
              schema:
                type: object
                required: [ok, items]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  items:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/sessions/revoke:
    post:
      summary: Revoke session
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, reason]
              properties:
                session_id: { type: string }
                reason: { type: string }
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                required: [ok, revoked_session_id]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  revoked_session_id: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/sessions/batch-revoke:
    post:
      summary: Batch revoke sessions in one transaction
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, session_ids]
              properties:
                reason: { type: string }
                dry_run: { type: boolean }
                session_ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Batch session revoke completed
          content:
            application/json:
              schema:
                type: object
                required: [ok, summary]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  dry_run:
                    type: boolean
                  summary:
                    $ref: '#/components/schemas/SessionBatchRevokeSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/audit:
    get:
      summary: Read audit log
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Audit log
          content:
            application/json:
              schema:
                type: object
                required: [ok, items]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  items:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/security-events:
    get:
      summary: Read security events
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Security events
          content:
            application/json:
              schema:
                type: object
                required: [ok, items]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  items:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/policies:
    get:
      summary: Get effective admin policy rules for current scope
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Effective policy rules
          content:
            application/json:
              schema:
                type: object
                required: [ok, rules]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  rules:
                    $ref: '#/components/schemas/PolicyRules'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Update admin policy rules for current scope
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, allowed_ips, allowed_hour_start_utc, allowed_hour_end_utc, require_step_up]
              properties:
                reason: { type: string }
                allowed_ips:
                  type: array
                  items:
                    type: string
                allowed_hour_start_utc:
                  type: integer
                  minimum: 0
                  maximum: 23
                allowed_hour_end_utc:
                  type: integer
                  minimum: 0
                  maximum: 23
                require_step_up: { type: boolean }
      responses:
        '200':
          description: Policy rules updated
          content:
            application/json:
              schema:
                type: object
                required: [ok, rules]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  rules:
                    $ref: '#/components/schemas/PolicyRules'
        '401':
          $ref: '#/components/responses/Unauthorized'
