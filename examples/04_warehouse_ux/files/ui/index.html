<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Warehouse UX · 10 экранов · Maniforge</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="login-view" class="login-wrap">
    <div class="panel login-card">
      <div class="brand">Warehouse UX</div>
      <p class="tag">10 экранов складского учёта на Maniforge</p>
      <label>RBAC <input id="rbacUrl" value="/proxy/rbac" /></label>
      <label>Manifest <input id="manifestUrl" value="/proxy/manifest" /></label>
      <label>Tenant <input id="tenantId" value="agency-demo" /></label>
      <label>Subtenant <input id="subtenantId" value="main" /></label>
      <label>Phone <input id="phone" value="+79000000003" /></label>
      <label>Password <input id="password" type="password" value="DemoAdmin!12345" /></label>
      <button type="button" id="btnLogin">Войти на склад</button>
      <pre id="loginOut" class="out" hidden></pre>
    </div>
  </div>

  <div id="app-view" class="app" hidden>
    <aside class="side">
      <div class="side-brand">WMS UX</div>
      <nav id="nav" class="nav"></nav>
      <div class="side-actions">
        <button type="button" class="ghost" id="btnEnsure">Схемы</button>
        <button type="button" class="ghost" id="btnSeed">Seed</button>
        <button type="button" class="ghost" id="btnLogout">Выйти</button>
      </div>
    </aside>
    <main class="main">
      <header class="main-head">
        <div>
          <h1 id="screenTitle">Обзор</h1>
          <p id="screenLead" class="tag"></p>
        </div>
        <button type="button" class="ghost" id="btnRefresh">Обновить данные</button>
      </header>
      <section id="kpis" class="kpis" hidden></section>
      <section id="content" class="content"></section>
      <pre id="deskOut" class="out" hidden></pre>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
