<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WB — Цветовая палитра</title>
  <script src="js/base.js?v=1"></script>
  <script src="js/theme.js?v=2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/palette.css" />
  <link rel="stylesheet" href="css/app.css?v=6" />
  <style>
    .palette-intro { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    .palette-group { margin-bottom: 28px; }
    .palette-group h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .swatches {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .swatch {
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--card);
    }
    .swatch-color { height: 72px; }
    .swatch-meta { padding: 10px 12px; }
    .swatch-name { font-size: 13px; font-weight: 600; display: block; margin-bottom: 2px; }
    .swatch-hex {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: var(--muted);
    }
    .semantic-demo {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }
    .semantic-chip {
      padding: 8px 14px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .ui-preview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .ui-preview .btn-primary { justify-content: center; }
  </style>
</head>
<body>
  <div class="layout">
    <header class="header">
      <div>
        <p class="eyebrow">Design system</p>
        <h1>Цветовая палитра</h1>
      </div>
      <div class="header-actions">
        <a class="btn" href="/app/stocks">← К остаткам</a>
      </div>
    </header>

    <p class="palette-intro card">
      Токены определены в <code>css/palette.css</code>. В компонентах используйте
      <code>var(--color-primary-600)</code> или алиасы <code>var(--primary)</code>, <code>var(--muted)</code>.
    </p>

    <section class="palette-group card" id="primary"></section>
    <section class="palette-group card" id="accent"></section>
    <section class="palette-group card" id="secondary"></section>
    <section class="palette-group card" id="tertiary"></section>
    <section class="palette-group card" id="rose"></section>
    <section class="palette-group card" id="emerald"></section>
    <section class="palette-group card" id="sky"></section>
    <section class="palette-group card" id="indigo"></section>
    <section class="palette-group card" id="chart"></section>
    <section class="palette-group card" id="neutral"></section>
    <section class="palette-group card" id="semantic"></section>
    <section class="palette-group card">
      <h2>UI-превью</h2>
      <div class="ui-preview">
        <button type="button" class="btn btn-primary">Primary</button>
        <button type="button" class="btn">Secondary</button>
        <span class="badge live">Подключено</span>
        <span class="badge demo">Демо</span>
      </div>
    </section>
  </div>

  <script>
    const scale = (name, steps) => steps.map((s) => `--color-${name}-${s}`);

    const GROUPS = {
      primary: {
        title: 'Primary — фиолетовый WB',
        vars: scale('primary', ['50','100','200','300','400','500','600','700','800','900']),
      },
      accent: {
        title: 'Accent — berry / magenta',
        vars: scale('accent', ['50','100','200','300','400','500','600','700','800','900']),
      },
      secondary: {
        title: 'Secondary — teal / ocean',
        vars: scale('secondary', ['50','100','200','300','400','500','600','700','800','900']),
      },
      tertiary: {
        title: 'Tertiary — amber / sunset',
        vars: scale('tertiary', ['50','100','200','300','400','500','600','700','800','900']),
      },
      rose: {
        title: 'Rose',
        vars: scale('rose', ['50','100','500','600','700']),
      },
      emerald: {
        title: 'Emerald — forest',
        vars: scale('emerald', ['50','100','500','600','700']),
      },
      sky: {
        title: 'Sky — ocean blue',
        vars: scale('sky', ['50','100','500','600','700']),
      },
      indigo: {
        title: 'Indigo',
        vars: scale('indigo', ['50','100','500','600','700']),
      },
      chart: {
        title: 'Chart — для графиков и списков',
        vars: ['1','2','3','4','5','6','7','8'].map((n) => `--color-chart-${n}`),
      },
      neutral: {
        title: 'Neutral — slate',
        vars: scale('neutral', ['0','50','100','200','300','400','500','600','700','800','900']),
      },
      semantic: {
        title: 'Semantic — статусы',
        vars: [
          '--color-success', '--color-success-light', '--color-success-border',
          '--color-warning', '--color-warning-light', '--color-warning-border',
          '--color-error', '--color-error-light', '--color-error-border',
          '--color-info', '--color-info-light', '--color-info-border',
        ],
      },
    };

    function hexFromVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function isLight(hex) {
      const h = hex.replace('#', '');
      if (h.length !== 6) return true;
      const r = parseInt(h.slice(0, 2), 16);
      const g = parseInt(h.slice(2, 4), 16);
      const b = parseInt(h.slice(4, 6), 16);
      return (r * 299 + g * 587 + b * 114) / 1000 > 160;
    }

    function renderGroup(id, { title, vars }) {
      const root = document.getElementById(id);
      root.innerHTML = `<h2>${title}</h2><div class="swatches"></div>`;
      const grid = root.querySelector('.swatches');
      for (const v of vars) {
        const hex = hexFromVar(v);
        const label = v.replace('--color-', '');
        grid.insertAdjacentHTML('beforeend', `
          <div class="swatch">
            <div class="swatch-color" style="background:${hex}"></div>
            <div class="swatch-meta">
              <span class="swatch-name">${label}</span>
              <span class="swatch-hex">${hex || v}</span>
            </div>
          </div>
        `);
      }
    }

    for (const [id, cfg] of Object.entries(GROUPS)) {
      renderGroup(id, cfg);
    }
  </script>
</body>
</html>
